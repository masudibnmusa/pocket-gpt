<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:#110d2e; }
  .banner { width:1280px; height:320px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between;
    padding:0 80px; background:
      radial-gradient(circle at 12% 18%, rgba(99,102,241,.75), transparent 45%),
      radial-gradient(circle at 92% 95%, rgba(192,38,211,.6), transparent 45%),
      radial-gradient(circle at 62% 0%, rgba(14,165,233,.35), transparent 40%),
      #110d2e; }
  h1 { font:800 70px/1 'Inter'; color:#fff; letter-spacing:-0.04em; }
  .tag { font:400 21px 'Inter'; color:rgba(255,255,255,.86); margin:14px 0 24px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; max-width:620px; }
  .pills span { font:500 13px 'JetBrains Mono'; color:#fff; padding:7px 13px; border-radius:999px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); }
  .card { width:478px; padding:20px 22px; border-radius:16px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(12px); box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .card .hd { display:flex; justify-content:space-between; font:500 12.5px 'JetBrains Mono'; color:rgba(255,255,255,.8); margin-bottom:14px; }
  .toks { display:flex; flex-wrap:wrap; gap:4px; }
  .toks span { font:400 15px/1 'JetBrains Mono'; color:#fff; padding:6px 5px; border-radius:5px; white-space:pre; }
  .toks span .sp { color:rgba(255,255,255,.45); }
  .card .ft { font:400 12.5px 'JetBrains Mono'; color:rgba(255,255,255,.8); margin-top:14px; }
  .card .ft b { color:#fff; font-weight:500; }
</style></head>
<body><div class="banner">
  <div>
    <h1>pocket-gpt</h1>
    <div class="tag">A tiny GPT language model, built from scratch.</div>
    <div class="pills"><span>BPE tokenizer</span><span>Transformer</span><span>AdamW + cosine</span><span>bf16</span><span>Sampling</span></div>
  </div>
  <div class="card">
    <div class="hd"><span>bpe.py · vocab 1024</span><span>Tiny Shakespeare</span></div>
    <div class="toks" id="t"></div>
    <div class="ft"><b>57</b> chars → <b>24</b> tokens</div>
  </div>
</div>
<script>
  // Real output of the repo's trained BPE (data/bpe1024) on this line.
  const toks = ['ROMEO', ':', ' ', 'But', ' so', 'f', 't', ',', ' what', ' li', 'ght', ' th', 'r', 'ough', ' y', 'ond', 'er', ' w', 'ind', 'ow', ' bre', 'ak', 's', '?'];
  const hues = ['99,102,241', '192,38,211', '14,165,233', '236,72,153', '139,92,246'];
  const t = document.getElementById('t');
  toks.forEach((s, i) => {
    const el = document.createElement('span');
    el.style.background = `rgba(${hues[i % hues.length]},.42)`;
    el.innerHTML = s.replace(/ /g, '<span class="sp">·</span>');
    t.appendChild(el);
  });
</script>
</body></html>
